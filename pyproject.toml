[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "nnterp/_version.py"

[project]
name = "nnterp"
dynamic = ["version"]
description = "One module vocabulary across transformer architectures, on top of nnsight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Clément Dumas", email = "butanium.contact@gmail.com" },
  { name = "Jaden Fiotto-Kaufman", email = "JadenFK@outlook.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["nnsight>=0.8", "transformers", "jaxtyping"]

[project.optional-dependencies]
# Tokenizers and processors some families' checkpoints need beyond transformers' defaults.
models = ["sentencepiece", "tiktoken", "protobuf", "pillow"]
# The vLLM engine (StandardizedVLLM).
vllm = ["vllm"]
test = ["pytest", "pytest-xdist", "jinja2", "markdown"]
# The encyclopedia generator (encyclopedia/build.py).
encyclopedia = ["jinja2", "markdown", "pygments"]

[project.urls]
"Homepage" = "https://github.com/ndif-team/nnterp"

[tool.setuptools.packages.find]
include = ["nnterp*"]

[tool.setuptools.package-data]
nnterp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
