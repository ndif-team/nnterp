name: Build and Deploy Documentation

# Deploys on every push that touches the site, on the branches the site lives on
# (as nnsight-website deploys from its docs branch). Add main once it is there.
on:
  push:
    branches: [site, 0.8-refactor]
    paths:
      - "site/**"
      - "nnterp/**"
      - "pyproject.toml"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # mkdocstrings imports nnterp to document it, so the package and its dependencies
      # are installed, not just the docs tools.
      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict -f site/mkdocs.yml

      # The encyclopedia is built locally (it needs the Hub cache) and published on the
      # orphan branch encyclopedia-site; the deploy serves it at /encyclopedia/.
      - name: Add the encyclopedia to the site
        run: |
          if git fetch --depth=1 origin encyclopedia-site; then
            mkdir -p site/build/encyclopedia
            git archive FETCH_HEAD | tar -x -C site/build/encyclopedia
            rm -f site/build/encyclopedia/README.md
          else
            echo "no encyclopedia-site branch yet; the site deploys without it"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
