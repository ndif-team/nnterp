name: Publish to PyPI

# A GitHub release publishes the package: the tag is the version (setuptools-scm),
# so nothing is bumped by hand. `workflow_dispatch` builds without publishing, to
# check a branch packages cleanly.
on:
  release:
    types: [published]
  workflow_dispatch:

# No job gets a token scope it does not ask for: the build needs none, the
# publish job takes id-token for Trusted Publishing.
permissions: {}

jobs:
  build:
    name: Build the sdist and the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version off the tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel holds the package and its version
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import importlib.metadata as m; print(m.version('nnterp'))"
          python -m zipfile -l dist/*.whl | grep -E "nnterp/(families|components)/__init__.py|nnterp/_version.py"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    # Trusted Publishing: PyPI mints a short-lived token from this job's OIDC
    # identity, so there is no API token to store or rotate. The publisher
    # registered on PyPI names this repository, this workflow file and this
    # environment, and all three must match.
    environment:
      name: pypi
      url: https://pypi.org/p/nnterp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pinned to the commit behind v1.14.2: the one step that can publish does
      # not track a moving tag.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
