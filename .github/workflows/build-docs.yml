name: Build and Deploy Documentation

# Deploys on every push to the site branch, as nnsight-website deploys from its docs branch.
# Once the site lives on main, change the branch here.
on:
  push:
    branches: [site]
    paths:
      - "site/**"
      - "nnterp/**"
      - "pyproject.toml"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # mkdocstrings imports nnterp to document it, so the package and its dependencies
      # are installed, not just the docs tools.
      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict -f site/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
