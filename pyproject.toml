[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nnter"
version = "0.0.1"
description = "One module vocabulary across transformer architectures, on top of nnsight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaden Fiotto-Kaufman", email = "JadenFK@outlook.com" }]
dependencies = ["nnsight>=0.8", "transformers", "jaxtyping"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["nnter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
